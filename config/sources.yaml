# Data source configuration. Validated 2026-10-09 where noted.

fred:
  base_url: "https://api.stlouisfed.org/fred"
  series:
    DFII10:
      metric: us_10y_real_yield
      description: "10-Year Treasury Inflation-Indexed Security, Constant Maturity"
      unit: percent
      expected_lag_days: 2
    DGS10:
      metric: us_10y_nominal_yield
      description: "Market Yield on U.S. Treasury Securities at 10-Year Constant Maturity"
      unit: percent
      expected_lag_days: 1
    T10YIE:
      metric: us_10y_breakeven_inflation
      description: "10-Year Breakeven Inflation Rate"
      unit: percent
      expected_lag_days: 1
    DTWEXBGS:
      metric: usd_broad_index
      description: "Nominal Broad U.S. Dollar Index"
      unit: index
      expected_lag_days: 2
      enabled: false

gold_price:
  primary: goldprice_dev
  validated: "2026-10-09"
  notes: "GET https://api.goldprice.dev/v1/prices?symbol=XAU-USD-SPOT — no key; check is_stale"

china_etf_159934:
  primary: yahoo_chart
  validated: "2026-10-09"
  notes: "Yahoo 159934.SZ chart API — exchange price, not NAV"

fx:
  usd_cny: yahoo_cny_x
  validated: "2026-10-09"

cot:
  primary: futuresbench_csv
  url: "https://futuresbench.com/data/cot/gold.csv"
  validated: "2026-10-09"
  notes: "Weekly; report_date is positions as-of, not release day"

fiscal:
  debt_to_penny: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny"
  interest_expense: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/interest_expense"
  validated: "2026-10-09"
  notes: "No API key required"

wgc:
  auto: false
  manual_csv: "data/manual/wgc_etf_flows.csv"
  portal: "https://www.gold.org/goldhub/data/gold-etfs-holdings-and-flows"
