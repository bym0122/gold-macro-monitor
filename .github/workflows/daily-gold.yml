name: Daily Gold Macro Monitor

on:
  schedule:
    # 北京时间 08:17 → UTC 00:17
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date YYYY-MM-DD (optional, default today UTC)"
        required: false
        type: string

concurrency:
  group: daily-gold
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest (must pass)
        env:
          PYTHONPATH: src
        run: pytest -q tests/

  run:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: src
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.report_date }}" ]; then
            DATE_ARG="--date ${{ inputs.report_date }}"
          fi
          python -m gold_monitor.cli daily $DATE_ARG

      - name: Commit reports & data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: daily gold macro update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Gold Macro Daily" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Report date input: ${{ inputs.report_date || 'today' }}" >> $GITHUB_STEP_SUMMARY
          echo "- FRED_API_KEY set: ${{ secrets.FRED_API_KEY != '' }}" >> $GITHUB_STEP_SUMMARY
          ls -la reports/ 2>/dev/null | tail -5 >> $GITHUB_STEP_SUMMARY || true
          ls -la data/news/ 2>/dev/null | tail -5 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Calendar source_detail" >> $GITHUB_STEP_SUMMARY
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, glob
          files = sorted(glob.glob("data/calendar/*.json"))
          if not files:
              print("(no calendar json)")
          else:
              p = json.load(open(files[-1], encoding="utf-8"))
              dq = p.get("data_quality") or {}
              stats = p.get("collection_stats") or {}
              detail = dq.get("source_detail") or stats.get("source_detail") or {}
              print(f"- file: {files[-1]}")
              print(f"- sources_ok: {dq.get('sources_ok')}")
              print(f"- sources_partial: {dq.get('sources_partial')}")
              print(f"- sources_failed: {dq.get('sources_failed')}")
              for k, v in detail.items():
                  print(f"- {k}: {v}")
              errs = stats.get("errors") or []
              if errs:
                  print("- errors:")
                  for e in errs:
                      print(f"  - {e}")
          PY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### News quality" >> $GITHUB_STEP_SUMMARY
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, glob
          files = sorted(glob.glob("data/news/*.json"))
          if not files:
              print("(no news json)")
          else:
              p = json.load(open(files[-1], encoding="utf-8"))
              st = p.get("collection_stats") or p.get("stats") or {}
              arts = p.get("articles") or []
              raw = st.get("raw_count", st.get("raw_fetched"))
              dropped = st.get("duplicates_dropped", st.get("exact_dupes_dropped"))
              after = st.get("after_deterministic_dedupe", len(arts))
              full = st.get("full_text_count", st.get("full_text_available"))
              if full is None:
                  full = sum(1 for a in arts if a.get("content_status") in ("full_text", "full_text_available"))
              rss = st.get("rss_summary_only")
              if rss is None:
                  rss = sum(1 for a in arts if a.get("content_status") == "rss_summary_only")
              print(f"- file: {files[-1]}")
              print(f"- raw: {raw} | deduped: {after} | dropped: {dropped}")
              print(f"- rss_summary_only: {rss} | full_text: {full}")
              if full == 0:
                  print("- NOTE: 本次只有 RSS 摘要，没有获取到全文")
              feeds = st.get("feeds") or []
              trunc = [f.get("feed") for f in feeds if f.get("possible_truncation")]
              failed = [f"{f.get('feed')}: {f.get('error')}" for f in feeds if f.get("error")]
              if trunc:
                  print(f"- possible_truncation: {trunc}")
              if failed:
                  print(f"- failed_feeds: {failed}")
          PY
