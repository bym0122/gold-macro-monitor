name: Daily Gold Macro Monitor

on:
  schedule:
    # 北京时间 08:17 → UTC 00:17
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date YYYY-MM-DD (optional, default today UTC)"
        required: false
        type: string

concurrency:
  group: daily-gold
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest (must pass)
        env:
          PYTHONPATH: src
        run: pytest -q tests/

  run:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: src
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.report_date }}" ]; then
            DATE_ARG="--date ${{ inputs.report_date }}"
          fi
          python -m gold_monitor.cli daily $DATE_ARG

      - name: Commit reports & data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: daily gold macro update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Gold Macro Daily" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Report date input: ${{ inputs.report_date || 'today' }}" >> $GITHUB_STEP_SUMMARY
          echo "- FRED_API_KEY set: ${{ secrets.FRED_API_KEY != '' }}" >> $GITHUB_STEP_SUMMARY
          ls -la reports/ 2>/dev/null | tail -5 >> $GITHUB_STEP_SUMMARY || true
          ls -la data/news/ 2>/dev/null | tail -5 >> $GITHUB_STEP_SUMMARY || true
