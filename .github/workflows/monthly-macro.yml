name: Monthly Fiscal / Macro

on:
  schedule:
    # 北京时间每月 8 日 10:31 → UTC 02:31
    - cron: "31 2 8 * *"
  workflow_dispatch:

concurrency:
  group: monthly-gold
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Monthly pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: src
        run: python -m gold_monitor.cli monthly
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ || true
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "data: monthly fiscal/macro $(date -u +%Y-%m-%d)"
            git push
          fi
