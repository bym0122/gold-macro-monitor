name: Weekly COT / WGC

on:
  schedule:
    # 北京时间周二 09:23 → UTC 01:23
    - cron: "23 1 * * 2"
  workflow_dispatch:

concurrency:
  group: weekly-gold
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Weekly pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: src
        run: python -m gold_monitor.cli weekly
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ || true
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "data: weekly gold flows/COT $(date -u +%Y-%m-%d)"
            git push
          fi
